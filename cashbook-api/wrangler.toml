# ==============================================================================
# GOLDEN ERP SYSTEM - CLOUDFLARE WORKER CONFIGURATION (DEVELOPMENT ENVIRONMENT)
# File: wrangler.toml  
# 💡 Features: Development D1 Binding, Flexible Dev CORS & Localhost Whitelist
# ==============================================================================

name = "cashbook-app-api-dev"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 💡 1. CLOUDFLARE D1 DATABASE BINDING (Dev Account အသစ်၏ Database ID)
[[d1_databases]]
binding = "DB"
database_name = "school-db-dev"
database_id = "cb3cc9ab-413e-455b-9f60-1abac992eb20"

# 💡 2. ENVIRONMENT VARIABLES (Development CORS Whitelist)
[vars]
# Dev Pages Domain အသစ်နှင့် Localhost test links များကို ခွင့်ပြုထားပါသည်
ALLOWED_ORIGIN = "https://cash-book-dev.pages.dev,http://localhost:8787,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173"
ENVIRONMENT = "development"

# 💡 3. AUTOMATED CRON TRIGGERS (Database Maintenance)
[triggers]
crons = ["0 0 * * *"]

# ==============================================================================
# 💡 4. REQUIRED WORKER SECRETS (Dashboard တွင် ထည့်သွင်းပြီးဖြစ်ပါသည်)
# ------------------------------------------------------------------------------
# 1. AUTH_SECRET      -> JWT Cryptographic Secret
# 2. RESEND_API_KEY   -> Resend Email API Key
# ==============================================================================