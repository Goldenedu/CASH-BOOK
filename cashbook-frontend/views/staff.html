<!-- views/staff.html (Staff Directory - Full Time / Part Time) --> 
<div class="space-y-5">

  <!-- Category Switcher: Full Time vs Part Time -->
  <div class="flex items-center gap-2 p-1.5 bg-[#0c1322] border border-slate-800 rounded-xl w-fit">
    <button onclick="switchStaffCategory('Full Time')" id="staff-tab-ft" class="px-4 py-2 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/10 flex items-center gap-2">
      <i class="fa-solid fa-user-check text-indigo-400"></i> Full Time Staff (FID)
    </button>
    <button onclick="switchStaffCategory('Part Time')" id="staff-tab-pt" class="px-4 py-2 rounded-lg text-xs font-bold transition-all bg-slate-800 text-slate-400 hover:text-white flex items-center gap-2">
      <i class="fa-solid fa-user-clock text-indigo-400"></i> Part Time Staff (PID)
    </button>
  </div>

  <!-- KPI Grid -->
  <div id="staff-kpi-grid" class="grid grid-cols-1 md:grid-cols-4 gap-4"></div>

  <!-- Search & Actions Bar -->
  <div class="flex flex-col md:flex-row justify-between items-center bg-[#0c1322] border border-slate-800 p-4 rounded-xl gap-4">
    <div class="relative w-full md:w-[450px]">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
        <i class="fa-solid fa-magnifying-glass text-xs"></i>
      </span>
      <input type="text" id="staff-search-input" oninput="onSearchInputStaff()" placeholder="Search staff name, staff ID, position..." class="w-full pl-9 pr-4 py-2 text-xs rounded-lg bg-[#0f172a] border border-slate-800 text-white focus:outline-none focus:border-indigo-500 transition-all">
    </div>

    <div class="flex items-center gap-2.5 w-full md:w-auto justify-end flex-wrap">
      <button onclick="loadStaffData(false)" class="p-2 bg-slate-850 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all">
        <i class="fa-solid fa-rotate text-xs"></i> Refresh
      </button>
      <button onclick="openGradeModal()" id="btn-edit-grade" class="p-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-lg shadow-amber-600/10">
        <i class="fa-solid fa-sliders text-xs"></i> Edit Salary Grade
      </button>
      <button onclick="exportToCSVStaff()" class="p-2 bg-slate-850 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all">
        <i class="fa-solid fa-file-export text-xs"></i> Export CSV
      </button>
      <button onclick="openAddModalStaff()" class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-black flex items-center gap-1.5 shadow-lg shadow-indigo-600/10 transition-all">
        <i class="fa-solid fa-plus text-xs"></i> Add Staff Record
      </button>
    </div>
  </div>

  <!-- Staff Table -->
  <div class="table-container bg-[#0c1322] border border-slate-800 shadow-2xl relative overflow-x-auto">
    <table class="w-full text-left border-collapse min-w-[1800px]">
      <thead id="staff-table-head"></thead>
      <tbody id="staff-table-body" class="divide-y divide-slate-800/40 text-slate-300"></tbody>
    </table>
  </div>

  <!-- Pagination Controls -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-[#0c1322] border border-slate-800 px-6 py-3.5 rounded-xl">
    <div id="staff-pagination-info" class="text-xs font-semibold text-slate-400 tracking-wide">Showing entries...</div>
    <div class="flex items-center gap-2">
      <button onclick="changePageStaff(-1)" id="staff-btn-prev" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-slate-850 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white font-bold transition-all text-xs">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
      </button>
      <button onclick="changePageStaff(1)" id="staff-btn-next" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-slate-850 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white font-bold transition-all text-xs">
        Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </div>

</div>

<!-- ADD / EDIT STAFF MODAL -->
<div id="staff-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="bg-[#0c1322] border border-slate-800 rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in fade-in zoom-in-95 duration-200">
    <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-[#0e172a] shrink-0">
      <h3 id="staff-form-title" class="text-sm font-black text-white uppercase tracking-wider">Add Staff Record</h3>
      <button onclick="closeStaffModal()" class="text-slate-500 hover:text-white transition"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>

    <form id="staff-form" onsubmit="saveStaffForm(event)" class="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
      <input type="hidden" id="staff-uniqueId">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="font-bold text-slate-400 uppercase tracking-wide">Join Date</label>
          <input type="date" id="staff-joindate" required class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500">
        </div>
        <div class="flex flex-col gap-1">
          <label class="font-bold text-slate-400 uppercase tracking-wide">Staff Name (အမည်)</label>
          <input type="text" id="staff-name" placeholder="e.g. Daw Thin Za Li" required class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="font-bold text-slate-400 uppercase tracking-wide">Education</label>
          <select id="staff-education" class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500"></select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="font-bold text-slate-400 uppercase tracking-wide">Position (ရာထူး)</label>
          <select id="staff-position" class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500"></select>
        </div>
      </div>

      <!-- Full Time Fields -->
      <div id="staff-fulltime-fields" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex flex-col gap-1">
            <label class="font-bold text-amber-400 uppercase tracking-wide">Salary Grade</label>
            <select id="staff-grade" onchange="onSalaryGradeChangeStaff()" class="w-full bg-[#0f172a] border border-slate-800 text-amber-300 font-bold rounded-lg p-2.5 outline-none focus:border-amber-500"></select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="font-bold text-slate-400 uppercase tracking-wide">Working Days (လုပ်ငန်းရက်)</label>
            <input type="number" id="staff-working-days" value="26" oninput="calculateLiveStaffSalary()" class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex flex-col gap-1">
            <label class="font-bold text-emerald-400 uppercase tracking-wide">Basic Amt (အခြေခံလစာ)</label>
            <input type="number" id="staff-basic" value="0" oninput="calculateLiveStaffSalary()" class="w-full bg-[#0f172a] border border-slate-800 text-emerald-400 font-bold rounded-lg p-2.5 outline-none focus:border-emerald-500">
          </div>
          <div class="flex flex-col gap-1">
            <label class="font-bold text-rose-400 uppercase tracking-wide">Extra Amt (အပိုကြေး)</label>
            <input type="number" id="staff-extra" value="0" oninput="calculateLiveStaffSalary()" class="w-full bg-[#0f172a] border border-slate-800 text-rose-400 font-bold rounded-lg p-2.5 outline-none focus:border-rose-500">
          </div>
        </div>

        <!-- Preview Card -->
        <div class="bg-indigo-950/30 border border-indigo-500/20 p-3.5 rounded-xl space-y-2.5">
          <div class="grid grid-cols-2 gap-2 text-center pb-2 border-b border-indigo-500/10">
            <div>
              <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">BONUS</p>
              <p id="preview-bonus" class="text-xs font-bold text-emerald-400">0 MMK</p>
            </div>
            <div>
              <p class="text-[10px] text-teal-400 font-bold uppercase tracking-wider">FUND</p>
              <p id="preview-fund" class="text-xs font-bold text-teal-400">0 MMK</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-center pt-0.5">
            <div>
              <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">TOTAL SALARY</p>
              <p id="preview-total-salary" class="text-xs font-bold text-slate-200">0 MMK</p>
            </div>
            <div>
              <p class="text-[10px] text-indigo-400 font-extrabold uppercase tracking-wider">NET SALARY</p>
              <p id="preview-total-net" class="text-xs font-extrabold text-indigo-400">0 MMK</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Part Time Fields -->
      <div id="staff-parttime-fields" class="hidden">
        <div class="flex flex-col gap-1">
          <label class="font-bold text-indigo-400 uppercase tracking-wide">Total Salary (စုစုပေါင်း လစာ)</label>
          <input type="number" id="staff-total-salary" value="0" class="w-full bg-[#0f172a] border border-slate-800 text-indigo-300 font-bold rounded-lg p-2.5 outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="font-bold text-slate-400 uppercase tracking-wide">NRC No</label>
          <input type="text" id="staff-nrc" placeholder="12/MAMANA(N)123456" class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500">
        </div>
        <div class="flex flex-col gap-1">
          <label class="font-bold text-slate-400 uppercase tracking-wide">Bank Account</label>
          <input type="text" id="staff-bank" placeholder="KBZ / CB / AYA Account" class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="font-bold text-slate-400 uppercase tracking-wide">Phone No</label>
          <input type="text" id="staff-phone" placeholder="09xxxxxxxxx" class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500">
        </div>
        <div class="flex flex-col gap-1">
          <label class="font-bold text-slate-400 uppercase tracking-wide">Email</label>
          <input type="email" id="staff-email" placeholder="staff@example.com" class="w-full bg-[#0f172a] border border-slate-800 text-slate-100 rounded-lg p-2.5 outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-bold text-rose-400 uppercase tracking-wide">Resigned Date (အလုပ်မှ နှုတ်ထွက်သည့်ရက် - ရှိပါက)</label>
        <input type="date" id="staff-resigned" onchange="calculateLiveStaffSalary()" class="w-full bg-[#0f172a] border border-slate-800 text-rose-300 rounded-lg p-2.5 outline-none focus:border-rose-500">
      </div>

      <div class="flex justify-end items-center gap-3 pt-4 border-t border-slate-800">
        <button type="button" onclick="closeStaffModal()" class="px-4 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">Cancel</button>
        <button type="submit" class="px-5 py-2 rounded-lg text-xs font-black bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/10 transition-all">Save Staff Record</button>
      </div>
    </form>
  </div>
</div>
