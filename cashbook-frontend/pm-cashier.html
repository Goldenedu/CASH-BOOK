<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PM Cashier POS - Golden ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { 
      background-color: #050b14; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    .glass-card { 
      background: rgba(15, 23, 42, 0.75); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(51, 65, 85, 0.4); 
    }
  </style>

  <!-- 💡 ပင်မ ERP ၏ Config နှင့် API စနစ်များကို တိုက်ရိုက် ချိတ်ဆက်ခြင်း -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="text-slate-100 min-h-screen pb-24 select-none">

  <!-- 💡 App Header -->
  <header class="sticky top-0 z-40 bg-[#080f1e]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 font-black text-sm">
        <i class="fa-solid fa-cash-register"></i>
      </div>
      <div>
        <h1 id="pm-cashier-title" class="text-xs font-black tracking-wide text-white uppercase">PM CASHIER</h1>
        <p id="pm-today-date" class="text-[10px] font-mono text-slate-400">Loading...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="loadPmCashierData()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center text-xs active:scale-95 transition" title="Refresh">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
      <button onclick="logoutCashier()" class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 border border-rose-500/20 flex items-center justify-center text-xs active:scale-95 transition" title="Logout">
        <i class="fa-solid fa-power-off"></i>
      </button>
    </div>
  </header>

  <!-- 💡 Main Mobile Container -->
  <main class="p-4 space-y-4 max-w-lg mx-auto">

    <!-- 🎯 Hero KPI Card: Cash in Hand -->
    <div class="glass-card p-5 rounded-2xl relative overflow-hidden border border-sky-500/30 bg-gradient-to-br from-[#0c1e38] via-[#091528] to-[#070e1c] shadow-2xl">
      <div class="flex justify-between items-start">
        <span class="text-[10px] font-black uppercase tracking-widest text-sky-400">လက်ဝယ်ရှိ ငွေသား (Cash In Hand)</span>
        <span class="px-2 py-0.5 rounded-full text-[9px] font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">ACTIVE</span>
      </div>
      <div class="mt-2">
        <h2 id="pm-hand-cash" class="text-3xl font-black text-white font-mono tracking-tight">0 <span class="text-sm font-bold text-sky-400">MMK</span></h2>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-slate-700/40 text-xs font-mono">
        <div>
          <span class="text-[10px] text-slate-400 block font-sans">အရင်းအဝင်ငွေ</span>
          <span id="pm-stat-in" class="font-bold text-emerald-400">+0 MMK</span>
        </div>
        <div class="text-right">
          <span class="text-[10px] text-slate-400 block font-sans">ထုတ်ပေးငွေ</span>
          <span id="pm-stat-out" class="font-bold text-rose-400">-0 MMK</span>
        </div>
      </div>
    </div>

    <!-- 🎯 Fast Primary Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="openWithdrawModal()" class="py-3.5 px-4 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white rounded-xl font-black text-xs shadow-lg shadow-sky-950 flex items-center justify-center gap-2 active:scale-95 transition">
        <i class="fa-solid fa-hand-holding-dollar text-sm"></i>
        <span>မုန့်ဖိုးထုတ်ပေးမည်</span>
      </button>

      <button onclick="openReturnModal()" class="py-3.5 px-4 bg-slate-800 hover:bg-slate-750 text-slate-200 border border-slate-700 rounded-xl font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition">
        <i class="fa-solid fa-vault text-amber-400 text-sm"></i>
        <span>Finance ငွေပြန်အပ်</span>
      </button>
    </div>

    <!-- 🎯 Transactions Section -->
    <div class="space-y-2.5 pt-2">
      <div class="flex justify-between items-center px-1">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-receipt text-sky-400"></i> မှတ်တမ်းများ (Transactions)
        </h3>
        <span id="pm-entries-count" class="text-[11px] font-mono text-slate-500">0 စောင်</span>
      </div>

      <div id="pm-feed-list" class="space-y-2.5">
        <!-- Dynamic Cards -->
      </div>
    </div>
  </main>

  <!-- ============================================================================== -->
  <!-- 💡 MODAL: PM WITHDRAW (မုန့်ဖိုးထုတ်ပေးရန် MODAL)                               -->
  <!-- ============================================================================== -->
  <div id="pm-withdraw-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#0e172a] border-t sm:border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="text-sm font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-hand-holding-dollar text-sky-400"></i> ကျောင်းသား မုန့်ဖိုးထုတ်ပေးခြင်း
        </h3>
        <button onclick="closeModal('pm-withdraw-modal')" class="text-slate-400 hover:text-white p-1 text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form onsubmit="submitWithdraw(event)" class="space-y-3.5 text-xs">
        <div class="space-y-1">
          <label class="font-bold text-slate-400 uppercase">ကျောင်းသား ID</label>
          <input type="number" id="w-student-id" oninput="lookupStudent()" placeholder="e.g. 1" required class="w-full bg-[#070e1c] border border-slate-700 rounded-xl px-3.5 py-3 text-base font-mono font-bold text-white focus:border-sky-500 outline-none">
        </div>

        <div id="w-student-card" class="hidden p-3 bg-sky-950/20 border border-sky-500/20 rounded-xl space-y-1">
          <div class="flex justify-between items-center">
            <span id="w-student-name" class="font-bold text-white text-xs">ကျောင်းသားအမည်</span>
            <span id="w-student-class" class="text-[10px] text-slate-400">အတန်း</span>
          </div>
          <div class="flex justify-between items-center pt-1 border-t border-slate-800">
            <span class="text-[10px] text-slate-400">မုန့်ဖိုးလက်ကျန်:</span>
            <span id="w-student-balance" class="font-mono font-black text-amber-400 text-sm">0 MMK</span>
          </div>
        </div>

        <div class="space-y-1">
          <label class="font-bold text-rose-400 uppercase">ထုတ်ပေးမည့် ငွေပမာဏ (MMK)</label>
          <input type="number" id="w-amount" placeholder="0" required class="w-full bg-[#070e1c] border border-slate-700 rounded-xl px-3.5 py-3 text-xl font-mono font-black text-rose-400 text-right focus:border-rose-500 outline-none">
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-400 uppercase">မှတ်ချက်</label>
          <input type="text" id="w-remark" placeholder="မုန့်ဖိုးထုတ်ပေးငွေ" class="w-full bg-[#070e1c] border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none">
        </div>

        <button type="submit" class="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-black text-xs shadow-lg shadow-sky-900 active:scale-95 transition">
          ငွေထုတ်ပေးမှု အတည်ပြုမည်
        </button>
      </form>
    </div>
  </div>

  <!-- ============================================================================== -->
  <!-- 💡 MODAL: RETURN TO FINANCE (FINANCE သို့ ငွေပြန်အပ် MODAL)                   -->
  <!-- ============================================================================== -->
  <div id="pm-return-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#0e172a] border-t sm:border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="text-sm font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-vault text-amber-400"></i> Finance သို့ လက်ကျန်ငွေ ပြန်အပ်ခြင်း
        </h3>
        <button onclick="closeModal('pm-return-modal')" class="text-slate-400 hover:text-white p-1 text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form onsubmit="submitReturn(event)" class="space-y-3.5 text-xs">
        <div class="space-y-1">
          <label class="font-bold text-amber-400 uppercase">ပြန်အပ်မည့် ငွေပမာဏ (MMK)</label>
          <input type="number" id="r-amount" placeholder="0" required class="w-full bg-[#070e1c] border border-slate-700 rounded-xl px-3.5 py-3 text-xl font-mono font-black text-amber-400 text-right focus:border-amber-500 outline-none">
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-400 uppercase">အကြောင်းပြချက်</label>
          <input type="text" id="r-remark" value="PM Cashier မှ Finance သို့ လက်ကျန်ငွေ ပြန်လည်အပ်နှံခြင်း" class="w-full bg-[#070e1c] border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none">
        </div>

        <button type="submit" class="w-full py-3.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-black text-xs shadow-lg shadow-amber-900 active:scale-95 transition">
          Finance သို့ ငွေပြန်လွှဲမည်
        </button>
      </form>
    </div>
  </div>

  <div id="pm-toast-box" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[999999] pointer-events-none w-11/12 max-w-sm"></div>

  <!-- ============================================================================== -->
  <!-- 💡 JAVASCRIPT APP LOGIC                                                        -->
  <!-- ============================================================================== -->
  <script>
    let gSession = null;
    let gCashierList = [];
    let gMatchedStudent = null;

    function showToast(type, msg) {
      const box = document.getElementById('pm-toast-box');
      if (!box) return;
      const isErr = (type === 'ERROR');
      box.innerHTML = `
        <div class="pointer-events-auto p-4 rounded-2xl shadow-2xl border-2 flex items-center gap-3 animate-in zoom-in-95 duration-150 ${
          isErr ? 'bg-rose-950 border-rose-500 text-white shadow-[0_0_40px_rgba(244,63,94,0.4)]' : 'bg-emerald-950 border-emerald-500 text-white shadow-[0_0_40px_rgba(16,185,129,0.4)]'
        }">
          <i class="fa-solid ${isErr ? 'fa-triangle-exclamation text-rose-400 text-xl' : 'fa-circle-check text-emerald-400 text-xl'}"></i>
          <p class="text-xs font-bold leading-snug flex-1">${msg}</p>
        </div>
      `;
      setTimeout(() => { if (box) box.innerHTML = ''; }, 3500);
    }

    // 💡 Root App Initialization
    window.addEventListener('DOMContentLoaded', async () => {
      const userStr = localStorage.getItem('golden_user') || localStorage.getItem('user');
      const token = localStorage.getItem('golden_auth_token') || localStorage.getItem('token');

      // 🎯 index.html အစား Root Domain (/) သို့ သွားမည်
      if (!userStr || !token) {
        window.location.href = '/';
        return;
      }
      gSession = JSON.parse(userStr);

      const titleEl = document.getElementById('pm-cashier-title');
      const role = gSession.role;
      if (role === 'pm_cashier1') titleEl.textContent = 'PM CASHIER 1 (ငွေကိုင် ၁)';
      else if (role === 'pm_cashier2') titleEl.textContent = 'PM CASHIER 2 (ငွေကိုင် ၂)';
      else titleEl.textContent = gSession.name || 'PM CASHIER';

      const d = new Date();
      document.getElementById('pm-today-date').textContent = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      await loadPmCashierData();
    });

    // 🚀 ပင်မ callApi() ကို သုံးထားသဖြင့် URL နှင့် Token အတိအကျဖြင့် ချိတ်ဆက်အလုပ်လုပ်ပါသည်
    async function loadPmCashierData() {
      try {
        const res = await callApi('getPmCashierBookData', { forceRefresh: true }, 'GET');
        if (res && res.success) {
          gCashierList = res.data || [];
          renderCashierView();
        } else {
          showToast("ERROR", res?.message || "Data ဆွဲယူ၍ မရပါ။");
        }
      } catch (err) {
        showToast("ERROR", "Data ဆွဲယူ၍ မရပါ: " + err.message);
      }
    }

    function renderCashierView() {
      let tIn = 0, tOut = 0;
      gCashierList.forEach(r => {
        tIn += Number(r.debit || 0);
        tOut += Number(r.credit || 0);
      });
      const bal = tIn - tOut;

      document.getElementById('pm-hand-cash').innerHTML = `${bal.toLocaleString('en-US')} <span class="text-sm font-bold text-sky-400">MMK</span>`;
      document.getElementById('pm-stat-in').textContent = `+${tIn.toLocaleString('en-US')} MMK`;
      document.getElementById('pm-stat-out').textContent = `-${tOut.toLocaleString('en-US')} MMK`;
      document.getElementById('pm-entries-count').textContent = `${gCashierList.length} စောင်`;

      const feed = document.getElementById('pm-feed-list');
      feed.innerHTML = '';

      if (gCashierList.length === 0) {
        feed.innerHTML = `<div class="p-8 text-center text-slate-500 font-bold text-xs">စာရင်း မရှိသေးပါ။</div>`;
        return;
      }

      const todayStr = new Date().toISOString().slice(0, 10);

      gCashierList.forEach(r => {
        const isFloat = r.category === 'Float Receive';
        const isReturn = r.category === 'Return to Finance';
        const isToday = (r.date === todayStr);

        // 🛡️ စည်းကမ်းချက် - Float Receive ကို လုံးဝဖျက်ခွင့်မရှိ။ ကျန်စာရင်းများကို ၁ ရက် (ယနေ့) သာ ဖျက်ခွင့်ပေးသည်။
        const canDelete = !isFloat && isToday;

        feed.innerHTML += `
          <div class="glass-card p-3.5 rounded-xl border border-slate-800/80 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${
                isFloat ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 
                (isReturn ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20')
              }">
                <i class="fa-solid ${isFloat ? 'fa-arrow-down' : (isReturn ? 'fa-vault' : 'fa-arrow-up')} text-sm"></i>
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  <span class="text-[9px] font-bold px-1.5 py-0.2 rounded uppercase ${
                    isFloat ? 'bg-emerald-500/20 text-emerald-300' : (isReturn ? 'bg-amber-500/20 text-amber-300' : 'bg-sky-500/20 text-sky-300')
                  }">${r.category}</span>
                  <span class="text-[10px] font-mono text-slate-400">${r.date}</span>
                </div>
                <h4 class="text-xs font-bold text-white truncate mt-0.5" title="${r.description || ''}">${r.description || '-'}</h4>
              </div>
            </div>

            <div class="text-right shrink-0">
              <span class="font-mono font-bold text-sm block ${r.debit > 0 ? 'text-emerald-400' : 'text-rose-400'}">
                ${r.debit > 0 ? '+' + Number(r.debit).toLocaleString() : '-' + Number(r.credit).toLocaleString()}
              </span>
              <div class="flex justify-end gap-2 mt-1">
                ${(isFloat || isReturn) ? `<button onclick="printVoucher('${r.uniqueId}')" class="text-slate-400 hover:text-sky-400 text-xs p-1" title="Print"><i class="fa-solid fa-print"></i></button>` : ''}
                ${canDelete ? `<button onclick="deleteEntry('${r.uniqueId}')" class="text-slate-500 hover:text-rose-400 text-xs p-1" title="Delete"><i class="fa-solid fa-trash"></i></button>` : ''}
              </div>
            </div>
          </div>
        `;
      });
    }

    async function lookupStudent() {
      const idVal = document.getElementById('w-student-id').value.trim();
      const card = document.getElementById('w-student-card');
      if (!idVal) return card.classList.add('hidden');

      try {
        const res = await callApi('lookupStudentById', { studentId: idVal }, 'GET');
        if (res && res.success && res.data) {
          gMatchedStudent = res.data;
          document.getElementById('w-student-name').textContent = res.data.name;
          document.getElementById('w-student-class').textContent = res.data.class || '';

          const sumRes = await callApi('getStudentMoneySummary', { searchVal: res.data.fyid }, 'GET');
          let bal = 0;
          if (sumRes && sumRes.success && sumRes.data) {
            const row = sumRes.data.find(s => s.studentId === parseInt(idVal, 10));
            if (row) bal = row.netBalance;
          }
          gMatchedStudent.balance = bal;
          document.getElementById('w-student-balance').textContent = `${Number(bal).toLocaleString()} MMK`;
          card.classList.remove('hidden');
        } else {
          gMatchedStudent = null;
          card.classList.add('hidden');
        }
      } catch (e) { card.classList.add('hidden'); }
    }

    async function submitWithdraw(e) {
      e.preventDefault();
      if (!gMatchedStudent) return showToast("ERROR", "ကျောင်းသား ID အမှန် ရှာမတွေ့ပါ။");

      const amount = parseFloat(document.getElementById('w-amount').value || 0);
      if (amount <= 0) return showToast("ERROR", "ထုတ်ယူမည့် ငွေပမာဏ ထည့်ပါ။");

      if (amount > gMatchedStudent.balance) {
        return showToast("ERROR", `ကျောင်းသားတွင် မုန့်ဖိုး (${gMatchedStudent.balance.toLocaleString()} MMK) သာ ကျန်သဖြင့် မလုံလောက်ပါ!`);
      }

      const curCash = parseFloat(document.getElementById('pm-hand-cash').textContent.replace(/[^0-9.-]+/g, '')) || 0;
      if (amount > curCash) {
        return showToast("ERROR", `ငွေကိုင်လက်ထဲတွင် လက်ကျန် (${curCash.toLocaleString()} MMK) သာ ရှိသဖြင့် မလုံလောက်ပါ!`);
      }

      const payload = {
        date: new Date().toISOString().slice(0, 10),
        category: 'PM Withdraw',
        studentId: parseInt(gMatchedStudent.studentId || gMatchedStudent.id, 10),
        studentName: gMatchedStudent.name,
        fyid: gMatchedStudent.fyid,
        studentClass: gMatchedStudent.class,
        credit: amount,
        description: document.getElementById('w-remark').value || `${gMatchedStudent.name} - မုန့်ဖိုးထုတ်ပေးငွေ`
      };

      closeModal('pm-withdraw-modal');
      const res = await callApi('savePmCashierBookEntry', payload);
      if (res && res.success) {
        showToast("SUCCESS", "မုန့်ဖိုး ထုတ်ပေးပြီးပါပြီ။");
        loadPmCashierData();
      } else {
        showToast("ERROR", res?.message || "မအောင်မြင်ပါ။");
      }
    }

    async function submitReturn(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('r-amount').value || 0);
      if (amount <= 0) return showToast("ERROR", "ပြန်အပ်မည့် ငွေပမာဏ ထည့်ပါ။");

      const curCash = parseFloat(document.getElementById('pm-hand-cash').textContent.replace(/[^0-9.-]+/g, '')) || 0;
      if (amount > curCash) {
        return showToast("ERROR", `လက်ထဲတွင် ငွေသား (${curCash.toLocaleString()} MMK) သာ ရှိသဖြင့် (${amount.toLocaleString()} MMK) ပြန်အပ်၍ မရပါ!`);
      }

      const payload = {
        date: new Date().toISOString().slice(0, 10),
        category: 'Return to Finance',
        credit: amount,
        description: document.getElementById('r-remark').value
      };

      closeModal('pm-return-modal');
      const res = await callApi('savePmCashierBookEntry', payload);
      if (res && res.success) {
        showToast("SUCCESS", "Finance သို့ ငွေပြန်အပ်ပြီးပါပြီ။");
        loadPmCashierData();
      } else {
        showToast("ERROR", res?.message || "မအောင်မြင်ပါ။");
      }
    }

    async function deleteEntry(uid) {
      if (!confirm("ဤစာရင်းအား ဖျက်မည်မှာ သေချာပါသလား?")) return;
      const res = await callApi('deletePmCashierBookEntry', { uniqueId: uid });
      if (res && res.success) {
        showToast("SUCCESS", "စာရင်း ဖျက်ပြီးပါပြီ။");
        loadPmCashierData();
      } else {
        showToast("ERROR", res?.message || "ဖျက်ခွင့် မရှိပါ။");
      }
    }

    function printVoucher(uniqueId) {
      const row = gCashierList.find(r => r.uniqueId === uniqueId);
      if (!row) return showToast("ERROR", "ပြေစာ အချက်အလက် မတွေ့ပါ။");

      const isFloat = row.category === 'Float Receive';
      const amount = (row.credit > 0 ? row.credit : row.debit) || 0;
      const vrNo = row.vrNo || 'TRF-' + String(row.date || '').replace(/-/g, '') + '-' + (row.no || '01');
      const dateStr = row.date || new Date().toISOString().slice(0, 10);
      const respPerson = row.responsibility_person || gSession?.name || 'Cashier';

      const copyTitleTop = isFloat ? "FINANCE COPY (ဗဟိုဘဏ္ဍာသိမ်းဆည်းရန်ပြေစာ)" : "FINANCE COPY (ဗဟိုဘဏ္ဍာလက်ခံပြေစာ)";
      const copyTitleBtm = isFloat ? "CASHIER COPY (ငွေကိုင်လက်ခံပြေစာ)" : "CASHIER COPY (ငွေကိုင်သိမ်းဆည်းရန်ပြေစာ)";
      const sender = isFloat ? "Finance Vault (ဗဟိုဘဏ္ဍာ)" : `${respPerson} (မုန့်ဖိုးငွေကိုင်)`;
      const receiver = isFloat ? `${respPerson} (မုန့်ဖိုးငွေကိုင်)` : "Finance Vault (ဗဟိုဘဏ္ဍာ)";

      const renderSlip = (title) => `
        <div style="border: 1.5px solid #1e293b; border-radius: 6px; padding: 18px 24px; background: #fff; color: #0f172a; font-family: sans-serif; box-sizing: border-box; margin-bottom: 8px;">
          <div style="text-align: center; border-bottom: 1.5px solid #0f172a; padding-bottom: 4px; margin-bottom: 10px;">
            <h2 style="margin: 0; font-size: 14px; font-weight: 900; text-transform: uppercase;">GOLDEN ERP SYSTEM</h2>
            <p style="margin: 2px 0 0 0; font-size: 11px; font-weight: bold; color: #334155;">${title}</p>
          </div>
          <table style="width: 100%; font-size: 11px; margin-bottom: 8px; border-collapse: collapse;">
            <tr><td><strong>လွှဲပြောင်းသူ:</strong> ${sender}</td><td style="text-align: right;"><strong>Date:</strong> ${dateStr}</td></tr>
            <tr><td><strong>လက်ခံသူ:</strong> ${receiver}</td><td style="text-align: right;"><strong>Voucher No:</strong> ${vrNo}</td></tr>
          </table>
          <table style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; border: 1px solid #334155;">
            <thead>
              <tr style="background: #f1f5f9; text-align: center;"><th style="border: 1px solid #334155; padding: 5px;">အကြောင်းအရာ</th><th style="border: 1px solid #334155; padding: 5px; width: 120px;">ပမာဏ</th></tr>
            </thead>
            <tbody>
              <tr><td style="border: 1px solid #334155; padding: 6px;">${row.description || '-'}</td><td style="border: 1px solid #334155; padding: 6px; text-align: right; font-weight: bold;">${Number(amount).toLocaleString()} MMK</td></tr>
            </tbody>
          </table>
          <div style="display: flex; justify-content: space-between; margin-top: 25px; text-align: center; font-size: 10px; font-weight: bold;">
            <div style="width: 40%; border-top: 1px dashed #334155; padding-top: 3px;">ငွေလက်ခံသူ</div>
            <div style="width: 40%; border-top: 1px dashed #334155; padding-top: 3px;">ငွေလွှဲပေးသူ</div>
          </div>
        </div>
      `;

      const printHtml = `
        <!DOCTYPE html><html><head><title>Print Voucher</title>
        <style>@page { size: A4 portrait; margin: 10mm; } body { margin:0; padding:0; background:#fff; font-family:sans-serif; } .cut { text-align:center; font-size:10px; color:#64748b; margin:8px 0; font-family:monospace; }</style>
        </head><body>
        ${renderSlip(copyTitleTop)}
        <div class="cut">✂ - - - - - - - - - - - - Cut Here - - - - - - - - - - - - ✂</div>
        ${renderSlip(copyTitleBtm)}
        </body></html>
      `;

      const w = window.open('', '_blank', 'width=800,height=900');
      if (!w) return showToast("ERROR", "Browser မှ Pop-up ပိတ်ထားပါသည်။");
      w.document.write(printHtml);
      w.document.close();
      setTimeout(() => { w.focus(); w.print(); w.close(); }, 400);
    }

    function openWithdrawModal() {
      document.getElementById('w-student-id').value = '';
      document.getElementById('w-amount').value = '';
      document.getElementById('w-student-card').classList.add('hidden');
      gMatchedStudent = null;
      document.getElementById('pm-withdraw-modal').classList.remove('hidden');
    }

    function openReturnModal() {
      document.getElementById('r-amount').value = '';
      document.getElementById('pm-return-modal').classList.remove('hidden');
    }

    function closeModal(id) { 
      document.getElementById(id).classList.add('hidden'); 
    }

    function logoutCashier() {
      localStorage.removeItem('golden_auth_token');
      localStorage.removeItem('golden_user');
      localStorage.removeItem('golden_user_role');
      localStorage.removeItem('golden_user_name');
      localStorage.removeItem('golden_token_expires_at');
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      // Root ရှိ index.html သို့ ပြန်ထွက်မည်
      window.location.href = '/';
    }
  </script>
</body>
</html>
