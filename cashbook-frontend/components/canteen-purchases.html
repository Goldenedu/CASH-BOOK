<!-- ============================================================================== -->
<!-- 🛒 VIEW: PURCHASES & SUPPLIERS AUDIT HUB (LIVE KPIS & MODERN TOOLBAR)          -->
<!-- File: components/canteen-purchases.html (Enterprise V9.4 Full Production)      -->
<!-- ============================================================================== -->
<div class="space-y-2">
  <!-- 1. Top 4 KPI Cards (ERP Standard Size) -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="stats-card p-5 rounded-xl flex items-start gap-4">
      <div class="p-3.5 rounded-lg bg-amber-500/10 text-amber-400"><i class="fa-solid fa-calendar-day text-xl"></i>
      </div>
      <div>
        <p class="text-[10px] uppercase font-bold tracking-wider text-slate-500">Today Purchase</p>
        <h3 id="pur-kpi-today" class="text-base font-extrabold text-white mt-1 font-mono">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card p-5 rounded-xl flex items-start gap-4">
      <div class="p-3.5 rounded-lg bg-sky-500/10 text-sky-400"><i class="fa-solid fa-calendar-days text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold tracking-wider text-slate-500">Monthly Purchase</p>
        <h3 id="pur-kpi-month" class="text-base font-extrabold text-white mt-1 font-mono">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card p-5 rounded-xl flex items-start gap-4">
      <div class="p-3.5 rounded-lg bg-indigo-500/10 text-indigo-400"><i class="fa-solid fa-boxes-packing text-xl"></i>
      </div>
      <div>
        <p class="text-[10px] uppercase font-bold tracking-wider text-slate-500">Total Purchase</p>
        <h3 id="pur-kpi-all" class="text-base font-extrabold text-white mt-1 font-mono">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card p-5 rounded-xl flex items-start gap-4">
      <div class="p-3.5 rounded-lg bg-emerald-500/10 text-emerald-400"><i class="fa-solid fa-boxes-stacked text-xl"></i>
      </div>
      <div>
        <p class="text-[10px] uppercase font-bold tracking-wider text-slate-500">Stocks Balance</p>
        <h3 id="pur-kpi-stock-bal" class="text-base font-extrabold text-white mt-1 font-mono">0 MMK</h3>
      </div>
    </div>
  </div>

  <!-- 2. ERP Standard Search & Action Bar -->
  <div
    class="flex flex-col lg:flex-row justify-between items-center bg-[#0c1322] border border-slate-800 p-4 rounded-xl gap-4">
    <div class="flex flex-col sm:flex-row items-center gap-2.5 w-full lg:w-auto">
      <div class="relative w-full sm:w-64">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i
            class="fa-solid fa-magnifying-glass text-xs"></i></span>
        <input type="text" id="pur-search" oninput="onSearchPurchasesDebounced()"
          placeholder="Search item, barcode, voucher, supplier..."
          class="w-full pl-9 pr-4 py-2 text-xs rounded-lg bg-[#0f172a] border border-slate-800 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div
        class="flex items-center gap-1.5 w-full sm:w-auto bg-[#0f172a] border border-slate-800 p-1 rounded-lg text-xs">
        <span class="text-[10px] text-slate-400 font-bold px-1.5 uppercase">From:</span>
        <input type="date" id="pur-date-from" onchange="loadPurchasesHistory(1)"
          class="bg-transparent text-white text-xs outline-none cursor-pointer">
        <span class="text-[10px] text-slate-400 font-bold px-1.5 uppercase">To:</span>
        <input type="date" id="pur-date-to" onchange="loadPurchasesHistory(1)"
          class="bg-transparent text-white text-xs outline-none cursor-pointer">
        <button onclick="clearPurchasesFilter()" class="p-1 text-slate-400 hover:text-rose-400 transition"
          title="Reset Filters"><i class="fa-solid fa-circle-xmark text-xs"></i></button>
      </div>
    </div>

    <div class="flex items-center gap-2.5 w-full lg:w-auto justify-end">
      <button onclick="loadPurchasesHistory(1)"
        class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-md active:translate-y-0.5 transition-all whitespace-nowrap">
        <i class="fa-solid fa-rotate text-xs"></i> Refresh
      </button>
      <button onclick="exportPurchasesCSV()"
        class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-md active:translate-y-0.5 transition-all whitespace-nowrap">
        <i class="fa-solid fa-file-export text-xs"></i> Export CSV
      </button>
      <button onclick="openItemModal()"
        class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-black flex items-center gap-1.5 shadow-lg shadow-indigo-600/20 active:translate-y-0.5 transition-all whitespace-nowrap">
        <i class="fa-solid fa-plus text-xs"></i> Add New Entry
      </button>
    </div>
  </div>

  <!-- 3. 17-Column Purchases Table -->
  <div class="table-container bg-[#0c1322] border border-slate-800 shadow-2xl relative overflow-x-auto rounded-xl">
    <table class="w-full text-left border-collapse min-w-[2100px]">
      <thead>
        <tr class="bg-[#0e172a]" style="height: 52px;">
          <th class="w-12 text-center text-slate-400 text-xs py-3">NO</th>
          <th class="w-32 text-slate-400 text-xs py-3">BARCODE</th>
          <th class="w-28 text-slate-400 text-xs py-3">CATEGORY</th>
          <th class="min-w-[180px] text-slate-400 text-xs py-3">ITEM NAME</th>
          <th class="w-24 text-slate-400 text-xs py-3">METHOD</th>
          <th class="w-20 text-right text-slate-400 text-xs py-3">QTY</th>
          <th class="w-28 text-right text-slate-400 text-xs py-3">PRICE</th>
          <th class="w-32 text-right text-amber-400 text-xs py-3">AMOUNT</th>
          <th class="w-28 text-right text-emerald-400 text-xs py-3">RETAIL PRICE</th>
          <th class="w-32 text-right text-sky-400 text-xs py-3">WHOLESALE PRICE</th>
          <th class="w-36 text-slate-400 text-xs py-3">SUPPLIER NAME</th>
          <th class="w-36 text-slate-400 text-xs py-3">SHOP NAME</th>
          <th class="w-28 text-slate-400 text-xs py-3">PH NO</th>
          <th class="min-w-[160px] text-slate-400 text-xs py-3">ADDRESS</th>
          <th class="w-28 text-slate-400 text-xs py-3">REF</th>
          <th class="w-36 text-slate-400 text-xs py-3">VOUCHER NO</th>
          <th class="min-w-[160px] text-slate-400 text-xs py-3">REMARK</th>
          <th
            class="w-20 text-center text-slate-400 text-xs py-3 right-0 sticky bg-[#0c1322] border-l border-slate-800">
            ACTION</th>
        </tr>
      </thead>
      <tbody id="pur-table-body" class="divide-y divide-slate-800/40 text-slate-300 text-xs"></tbody>
    </table>
  </div>

  <!-- 4. Pagination Footer -->
  <div
    class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-[#0c1322] border border-slate-800 px-6 py-3.5 rounded-xl">
    <div id="pur-pagination-info" class="text-xs font-semibold text-slate-400 font-mono">Showing 0 entries</div>
    <div class="flex items-center gap-2">
      <button type="button" onclick="changePurchasesPage(-1)" id="pur-btn-prev"
        class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-slate-850 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white font-bold transition-all disabled:opacity-30 disabled:pointer-events-none text-xs">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
      </button>
      <button type="button" onclick="changePurchasesPage(1)" id="pur-btn-next"
        class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-slate-850 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white font-bold transition-all disabled:opacity-30 disabled:pointer-events-none text-xs">
        Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </div>
</div>
